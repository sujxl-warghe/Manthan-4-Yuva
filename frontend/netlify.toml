# Netlify deployment config for the VrukshaSetu Next.js frontend.
#
# Usage:
#   1. Push this repo to GitHub.
#   2. In Netlify: Add new site -> Import an existing project -> select this
#      repo. Netlify reads this file automatically (base = frontend/).
#   3. In Site settings -> Environment variables, set:
#        NEXT_PUBLIC_API_URL = https://your-backend.onrender.com
#        NEXT_PUBLIC_APP_DOWNLOAD_URL = /downloads/VrukshaSetu-debug.apk
#      (NEXT_PUBLIC_PLAY_STORE_URL optional, leave blank until published)
#   4. Deploy. The Next.js Runtime plugin (installed automatically) handles
#      SSR/App Router routing — no extra config needed.

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"
